# The offer ladder (Change 02 §2 and §4.2). Display order is the ladder order.
# price_from: a number like "$450". Leave it "" to show "Pricing on request".
# checkout_url: Phase 2 hook for payment links. Leave empty.
# Prices after 3 case studies (not shown on the site): Tune-Up $600, The 30-Day Fix $1,500, Growth Advisor $650/month.

page:
  heading: Offers and prices
  intro: Four steps. Start anywhere. What you pay for one step is credited toward the next if you upgrade within 30 days.
  ladder_rule: Start anywhere. What you pay for one step is credited toward the next if you upgrade within 30 days.
  labels:
    for: Who it's for
    get: What you get
    needs: What I need from you
    your_time: Your time
    timeline: Timeline
    terms: Terms
    guarantee: Guarantee
    see_details: See details
    book_button: Book a call
    founding_link: Or apply as a founding client
    starting_at: Starting at
    on_request: Pricing on request
  addons_heading: Add-ons
  dont_do:
    heading: What I don't do myself
    body: "Ads management, social media posting (Facebook, Instagram and similar), logo or design work, and full website rebuilds. If you need one, I'll introduce you to a partner who quotes and bills you directly."

offers:
  - id: website-review
    name: Website Review
    type: Free diagnostic
    free: true
    price_from: ""
    one_liner: I look at your website and Google profile and send you the top 3 things costing you calls.
    for: Owners who want to know why the phone isn't ringing more, without paying to find out.
    get:
      - An outside-in look at your website, your Google profile, and how you show up for 3 searches your customers make.
      - The top 3 fixes, ranked by the calls they're likely costing you.
      - A short video walkthrough or PDF, your choice.
      - A do-it-yourself checklist that's yours to keep.
    needs: Your website address, and the 3 services that earn you the most.
    timeline: Within 5 business days.
    note: No sales pitch. If you'd rather fix things yourself, the checklist is yours.
    button: { label: Get my free Website Review, href: "/review" }
    checkout_url: ""

  - id: profile-tune-up
    name: Google Profile Tune-Up
    type: Quick win
    price_from: "$450"
    one_liner: I clean up your Google profile and set up a simple way to get reviews after every job.
    for: Owners who want a quick, visible win before a bigger project.
    get:
      - "A full Google Business Profile cleanup: categories, services, service area, hours, description, photos and Q&A."
      - Your review link turned into a short link and a QR code for invoices, your counter and your trucks.
      - A review request message loaded into the invoicing or booking tool you already use.
      - A before-and-after check of your profile numbers and review count at 30 days.
    your_time: About 30 minutes.
    timeline: Work done within 1 week, results checked at 30 days.
    terms: Paid upfront. Credited toward The 30-Day Fix if you upgrade within 30 days.
    guarantee: If anything in your plan isn't done by the date I gave you, I keep working at no charge until it is.
    checkout_url: ""

  - id: thirty-day-fix
    name: The 30-Day Fix
    type: Core project
    price_from: "$1,250"
    one_liner: Your Google profile, reviews and a service page that turns searches into quote requests, done in 30 days.
    for: Owners ready to turn Google searches into quote requests.
    get:
      - Everything in the Tune-Up.
      - One service page for the service that earns you the most, written and built on your current website, with reviews, photos, one-tap calling and a short quote form.
      - Review reply templates for good and bad reviews, plus a one-line script your team can use to ask.
      - A "How did you hear about us?" question added to your booking or invoicing tool, so you can see where jobs come from.
      - Results checked at 30, 60 and 90 days.
    your_time: About 45 minutes in total.
    timeline: Installed in 30 days.
    terms: 50% upfront and 50% on day 30, or 3 equal monthly payments. Tune-Up fee credited within 30 days.
    guarantee: If anything in your plan isn't done by day 30, I keep working at no charge until it is.
    checkout_url: ""

  - id: growth-advisor
    name: Growth Advisor
    type: Monthly
    price_from: "$500"
    price_suffix: /month
    one_liner: The 30-Day Fix with $0 upfront, then I keep your profile, reviews and pages working every month.
    for: Owners who want this handled every month without thinking about it.
    get:
      - The 30-Day Fix, with $0 upfront.
      - heading: "Then every month:"
        items:
          - Google profile posts and photo updates.
          - Replies to your reviews.
          - One new page or website edit.
          - A short report of calls, clicks and reviews, with your history saved past Google's six-month limit.
          - A 30-minute call.
    terms: Billed monthly in advance with a 6-month minimum. If you cancel before month 4, the rest of The 30-Day Fix is due ($1,250 minus $250 for each month paid).
    guarantee: If anything in your plan isn't done by the date I gave you, I keep working at no charge until it is.
    checkout_url: ""

addons:
  - id: extra-page
    name: Extra service page
    price_label: Starting at $750
    one_liner: One more page for a service or area you want to show up for.
  - id: lead-pipelines
    name: Lead Pipelines
    price_label: Ask me
    one_liner: Quote follow-up and past-customer emails that run in the tools you already use.
  - id: advisory-hour
    name: Advisory hour
    price_label: $200/hour
    one_liner: An hour on whatever is stuck. Vendors, a redesign, a new service.
