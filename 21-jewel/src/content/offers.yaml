# The ladder (Change 03 §4). Display order is the ladder order: the free audit, then three brackets.
# price_from: a number like "$650". Leave it "" to show "Pricing on request".
# The content Sheet's "offers" tab can change name, price_from, price_suffix, one_liner and active.
# Prices after 3 case studies (not shown on the site): Get Found $850, Get Chosen $1,950, Keep Ranking $600/month.
# checkout_url: hook for payment links later. Leave empty.

page:
  heading: Pricing
  intro: Start with the free audit. Then pick the one step that fits where you are. Every price is the real starting price, and every bracket is a fixed scope, so the quote conversation is short.
  ladder_rule: Half of any setup fee is credited against your first three months of Keep Ranking when it starts within 60 days.
  labels:
    for: Who it's for
    get: What you get
    needs: What I need from you
    your_time: Your time
    timeline: Timeline
    terms: Terms
    guarantee: Guarantee
    see_details: See what's included
    book_button: Start with the free audit
    founding_link: Or apply as a founding client
    starting_at: From
    on_request: Pricing on request
  addons_heading: If you need more
  dont_do:
    heading: What I don't do myself
    body: "Ongoing social media posting (Facebook, Instagram and similar), paid search and Local Services Ads management, logo or design work, and full website rebuilds. If you need one, I'll introduce you to a partner who quotes and bills you directly, and I'll make sure what they build fits the rest."
  measure:
    heading: How I measure
    body: "Before I change anything, I save five numbers: calls from your Google profile, direction requests, website clicks, your review count and rating, and where you rank on the map for your three best searches, checked from three spots in your service area. Google only keeps about six months of profile history, so I keep yours from day one. You see the same five numbers at 30, 60 and 90 days, side by side. I present them as signs of progress, and I claim a job only when your \"How did you hear about us?\" field says so."

offers:
  - id: audit
    name: Free Local Search Audit
    type: Free
    free: true
    price_from: ""
    one_liner: A 10-minute video and a one-page scorecard. The top 3 things costing you calls, ranked.
    for: Any owner who wants to know why the phone isn't ringing more, without paying to find out.
    get:
      - How you show up right now on Google, Bing and Apple Maps for the three searches your customers actually make.
      - What your reviews say to someone choosing between you and the shop down the street.
      - Whether your website gets the call on a phone, measured in taps.
      - The top 3 fixes, ranked by the calls they're likely costing you, in a 10-minute screen recording and a one-page scorecard you keep.
    needs: Nothing. Everything I look at is public.
    timeline: Delivered within 5 business days.
    note: No pitch inside the video. If you'd rather fix things yourself, the scorecard tells you how.
    button: { label: Get my free Local Search Audit, href: "/audit" }
    checkout_url: ""

  - id: get-found
    name: Get Found Setup
    type: One-time
    price_from: "$650"
    one_liner: Your Google, Bing and Apple profiles rebuilt, the 10 listings that matter fixed, and a review system that runs itself.
    for: Owners whose profile is thin, wrong or invisible, which is most of the businesses I audit.
    get:
      - Your Google Business Profile rebuilt around your best jobs. The right main category, every service listed, hours, service area, 15 or more real photos, Q&A and products.
      - Bing Places and Apple Business Connect claimed and matched, so Microsoft and iPhone searches find the same business Google does.
      - The 10 listings that feed the map results set to one name, address and phone.
      - A review link, a QR code for invoices and trucks, and a text or email ask you can send in 10 seconds.
      - 3 months of profile posts written and scheduled.
      - Your five baseline numbers saved before anything changes.
    needs: Manager access to your Google profile (2 minutes, no passwords), a 20-minute call, and photos of your work.
    your_time: About 30 minutes.
    timeline: Done within 10 business days. Numbers checked at 30 days.
    terms: Paid upfront. Half is credited against Keep Ranking if it starts within 60 days.
    guarantee: If anything in your plan isn't done by the date I gave you, I keep working at no charge until it is.
    checkout_url: ""

  - id: get-chosen
    name: Get Chosen Setup
    type: One-time
    price_from: "$1,450"
    one_liner: Your homepage and up to 3 service pages rewritten on your current website, with one-tap calling and a 5-field quote form.
    for: Owners whose profile already brings visits that the website wastes. Comes after Get Found, or an equivalent profile already in shape.
    get:
      - Your homepage rewritten and restructured on the platform you already use (Wix, Squarespace, WordPress, GoDaddy, Shopify or Google Sites).
      - Up to 3 service pages, one per service that earns you the most, written the way your customers search and with the questions they'd ask on the phone answered.
      - One-tap calling at the top of every page and a 5-field quote form with "How did you hear about us?" built in.
      - The structured data that lets Google and the AI answers understand what you do and where.
      - Google Analytics and Search Console set up, with calls and form sends tracked.
      - Speed and mobile fixes within what your platform allows.
    needs: Editor access to your website, approval of the words before they go live, and about 45 minutes across two calls.
    your_time: About 45 minutes.
    timeline: About 3 weeks.
    terms: 50% upfront, 50% when the pages are live. Half is credited against Keep Ranking if it starts within 60 days.
    guarantee: If anything in your plan isn't done by the date I gave you, I keep working at no charge until it is.
    checkout_url: ""

  - id: keep-ranking
    name: Keep Ranking
    type: Month-to-month
    price_from: "$450"
    price_suffix: /month
    one_liner: I keep your profile, reviews and listings working every month, and show you the numbers. Cancel any month.
    for: Owners who want this handled without thinking about it, after Get Found or Get Chosen.
    get:
      - heading: "Every month:"
        items:
          - 4 Google profile posts with the photos you text me.
          - Review asks sent after your jobs, and every review answered within 2 business days.
          - Your listings checked and corrected if something drifts.
          - A one-page report of your five numbers, with your history kept past Google's six-month limit.
          - A 20-minute call to decide what's next.
      - heading: "Every quarter:"
        items:
          - One new page or guide on your website for a service or question your customers search for.
    needs: Photos from the field a few times a month, and 20 minutes on the call.
    your_time: About 30 minutes a month.
    timeline: Starts the month after your setup. Report on the same day each month.
    terms: Billed monthly in advance. Cancel any month with notice before the next billing date. No minimum.
    guarantee: If anything in your plan isn't done by the date I gave you, I keep working at no charge until it is.
    checkout_url: ""

addons:
  - id: extra-page
    name: Extra service page
    price_label: $350
    one_liner: One more page for a service you want to show up for, written and built on your site.
  - id: extra-area-page
    name: Extra industry or area page
    price_label: $350
    one_liner: A page for a second trade you serve or a town you want more work from.
  - id: partner-work
    name: Social posting or paid search
    price_label: Partner quote
    one_liner: Set up through a vetted partner who quotes and bills you directly. I make sure it fits the rest.
  - id: advisory-hour
    name: Advisory hour
    price_label: $150/hour
    one_liner: An hour on whatever is stuck. Vendors, a redesign, a new service, a bad review.
