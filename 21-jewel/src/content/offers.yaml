# The offer ladder (spec §3). Display order is the ladder order.
# price_from: set to a number like "$750". Leave it "" to show "Pricing on request".
# checkout_url: Phase 2 hook for payment links. Leave empty in Phase 1.

page:
  heading: Offers
  intro: Start with the free scorecard, or pick the step that fits where you are. The Website Review fee is credited toward The 30-Day Fix if booked within 30 days.
  ladder_rule: The Website Review fee is credited toward The 30-Day Fix if booked within 30 days.
  labels:
    for: Who it's for
    get: What you get
    timeline: Timeline
    terms: Terms
    scorecard_button: Take the scorecard
    book_button: Book a call
    founding_link: Or apply as a founding client
    starting_at: Starting at
    on_request: Pricing on request
  faq_heading: Questions

offers:
  - id: scorecard
    name: Is Your Website Losing You Work?
    type: Free
    free: true
    price_from: ""
    one_liner: A 3-minute scorecard. See your score and your biggest leak.
    for: Any owner who wants a quick, honest read on how new work finds them.
    get:
      - 12 questions
      - Instant score
      - Biggest leak on screen
      - Full breakdown by email
    timeline: About 3 minutes
    checkout_url: ""

  - id: website-review
    name: Website Review
    type: Paid diagnostic
    price_from: "$950"
    one_liner: An outside-in review of your site, search presence and inquiry path, with fixes ranked.
    for: Owners whose website gets visits but few inquiries, or who aren't sure what it's doing for them.
    get:
      - An outside-in review of your website, search presence and Google Business Profile
      - A 60-minute working session, including how your work finds you today
      - A written report with fixes ranked by effort and payoff
      - A 30-minute walkthrough
    timeline: About 2 weeks
    terms: 50% upfront, 50% on delivery.
    checkout_url: ""

  - id: thirty-day-fix
    name: The 30-Day Fix
    type: Sprint
    price_from: "$2,500"
    one_liner: We fix your website's message, inquiry path and tracking in 30 days.
    for: Firms ready to fix what the review found.
    get:
      - New page structure and copy for your homepage and up to 3 service pages
      - Google Business Profile cleanup
      - 'An inquiry form with a "How did you hear about us? Who referred you?" field'
      - "Tracking set up: GA4, Search Console and call tracking"
      - Weekly 30-minute check-ins
    note: Edits are made on your current platform. A full rebuild goes to a vetted partner, quoted separately.
    timeline: 30 days
    terms: 50% upfront, 50% on delivery. The Website Review fee is credited if booked within 30 days.
    checkout_url: ""

  - id: lead-pipelines
    name: Lead Pipelines
    type: Build
    price_from: "$3,500"
    one_liner: Pages, follow-up emails and tracking that turn visits and past clients into steady leads.
    for: Firms whose website works and who want steady new leads.
    get:
      - A lead offer and landing page
      - Inquiry and quote follow-up emails
      - A post-job email asking for a review and a referral
      - A past-client reactivation sequence
      - A local search plan and a paid test plan
    note: Ongoing posting or ad management goes to your team or vetted partners.
    timeline: 60 to 90 days
    terms: 50% upfront, 50% on delivery.
    checkout_url: ""

  - id: growth-advisor
    name: Growth Advisor
    type: Retainer
    price_from: "$750"
    price_suffix: /month
    one_liner: A monthly review of your leads and numbers, and a steady hand on what's next.
    for: Firms that want accountability and someone watching the numbers.
    get:
      - A monthly 60-minute review of a simple lead dashboard
      - Async questions
      - A quarterly plan refresh
      - Help directing your vendors and designers
    timeline: 3-month minimum, then month to month
    terms: Billed monthly in advance. 3-month minimum.
    checkout_url: ""

  - id: studio-sprint
    name: White-label Strategy Sprint
    type: Studio partners only
    studio_only: true
    price_from: ""
    one_liner: Strategy delivered under your studio's name.
    for: Design studios of 2 to 10 people.
    get: []
    timeline: 2 to 3 weeks
    checkout_url: ""

faq:
  - q: Do I need to start with the Website Review?
    a: No. The scorecard is free and points you to the right step.
  - q: Do you build websites?
    a: I rewrite and restructure your site and make the edits on your current platform. Full rebuilds go to a vetted partner, quoted separately.
  - q: Do you run ads or post content for me?
    a: No. I build the plan and the systems. Ongoing posting or ads go to your team or vetted partners.
  - q: Do you work outside San Antonio?
    a: Yes, everything works remotely.
  - q: What if my score is already high?
    a: Then Lead Pipelines is usually the next step.
