# Example card. Must stay labeled as an example. It is not a real client.
example:
  label: Example audit
  items:
    - Your Google profile's main category is "Contractor." Your best jobs are roof replacements. Searchers for those never see you.
    - Apple Maps lists an old address, so iPhone directions requests go to your last shop.
    - Last Google review was 7 months ago. Three competitors got 10 or more in that time.
  footer: Every audit ends with the top 3 fixes, ranked by the calls they're likely costing you.

pains:
  heading: Sound familiar?
  items:
    - The phone's quiet, and you can't tell why.
    - You're paying Angi or Thumbtack for leads your competitor gets free.
    - Your last Google review is from a year ago.
    - You paid someone for SEO and never saw what they did.

how:
  eyebrow: How it works
  heading: Get found. Get chosen. Get the call.
  intro: Three things decide whether a search turns into a job. Most businesses lose it at one of them.
  labels:
    means: What it means
    breaks: What usually breaks
    fix: What I fix
  steps:
    - name: Get found
      means: Your profile shows up when someone nearby searches for what you do, on Google, Bing, Apple Maps and the directories that feed them.
      breaks: The wrong main category, a service area that's too small or too big, and listings with three versions of your phone number.
      fix: The profile rebuilt around your best jobs, Bing and Apple claimed, and the listings that matter set to one name, address and phone.
      link: { label: See Get Found Setup, href: "/services/get-found" }
    - name: Get chosen
      means: Reviews, photos and a page that answer the questions people would ask you on the phone.
      breaks: A last review from months ago, stock photos, and a website that says "quality service" instead of what you do and where.
      fix: A review ask that goes out after every job, your real work in photos, and pages written the way your customers search.
      link: { label: See Get Chosen Setup, href: "/services/get-chosen" }
    - name: Get the call
      means: A tap-to-call button, a short quote form and a reply the same day.
      breaks: A phone number buried in the footer, a 12-field form, and a voicemail that fills up.
      fix: One-tap calling at the top of every page, a 5-field quote form, and tracking so you know which calls came from where.
      link: { label: See Keep Ranking, href: "/services/keep-ranking" }

