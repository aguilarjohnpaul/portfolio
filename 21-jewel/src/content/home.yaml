measure:
  heading: Numbers before. Numbers after.
  body: Before I change anything, I save your Google profile numbers (calls, direction requests, website clicks), your review count, and where you rank on the map for your top searches. Google only keeps about six months of that history, so I keep yours from day one. You see the change at 30, 60 and 90 days.
  link: { label: How I measure, href: "/pricing#how-i-measure" }

