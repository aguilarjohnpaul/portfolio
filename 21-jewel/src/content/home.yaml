# Homepage copy, section by section (Change 02 §4.1).

hero:
  eyebrow: For local service businesses
  primary: { label: Get my free Website Review, href: "/review" }
  secondary: { label: Or take the 3-minute scorecard, href: "/scorecard" }
  variants:
    a:
      h1: More calls from Google. No new software.
      subhead: I fix your Google profile, reviews and website so more searches turn into calls. You spend about 30–45 minutes. I show you your numbers before and after.
    b:
      h1: Be the shop people call first.
      subhead: I fix your Google profile, reviews and website so more searches turn into calls. You spend about 30–45 minutes. I show you your numbers before and after.

# Example card. Must stay labeled as an example. It is not a real client.
example:
  label: Example Website Review
  items:
    - Your Google profile's main category doesn't match the service that earns you the most.
    - Requesting a quote on a phone takes 5 taps. It should take 1.
    - Your last Google review was 7 months ago.
  footer: Every review ends with the top 3 fixes, ranked by the calls they're likely costing you.

pains:
  heading: Sound familiar?
  items:
    - The phone is quieter than it should be for how good your work is.
    - Customers find you by word of mouth, almost never Google.
    - Your website looks fine, but hardly anyone fills out the form.
    - Your last Google review was months ago.
    - You've paid someone for "SEO" and never saw what they did.

how:
  eyebrow: How it works
  heading: Review. Fix. Prove.
  steps:
    - name: Review
      body: I look at your website and Google profile from the outside and send you the top 3 things costing you calls. Free.
    - name: Fix
      body: I fix them myself, using the tools you already have. You spend about 30–45 minutes with me in total.
    - name: Prove
      body: I save your numbers before I start and show you what changed at 30, 60 and 90 days.
  framework: Get found → Get hired → Get hired again.

your_part:
  heading: What you'll need to do
  items:
    - Add me as a manager on your Google profile. It takes 2 minutes, and no passwords are shared.
    - One 20-minute call so I understand your best jobs and customers.
    - Approve the words before anything goes live.
    - Text me some photos of your work.
  closing: That's it. I handle the rest.

offers:
  eyebrow: Offers
  heading: Start anywhere.

promise:
  label: My promise
  items:
    - No new software to pay for
    - No passwords shared
    - No contracts on project work
    - You own everything I set up

measure:
  heading: You'll see the numbers, not just a report.
  body: Before I touch anything, I save your Google profile numbers (calls, direction requests, website clicks), your review count and where you show up on the map for your top searches. Google only shows about six months of profile history, so I keep yours from day one. Then I show you the change at 30, 60 and 90 days.
  # The doc links this to the offers FAQ; while the FAQ is hidden it goes to the offers page.
  link: { label: See offers and prices, href: "/offers" }

# Hidden while site.yaml flags.showFounding is false.
founding:
  eyebrow: Founding clients
  heading: "5 founding spots: The 30-Day Fix, free."
  body: I'm building my first case studies. If your business is a fit, I'll do The 30-Day Fix at no cost in exchange for permission to share the results.
  button: { label: See if you're a fit, href: "/founding-clients" }

proof:
  eyebrow: Results
  heading: What clients say

about:
  # Put a 4:5 photo at public/jp.jpg and set photo: /jp.jpg
  photo: ""
  photo_alt: "[PLACEHOLDER: headshot]"
  heading: Hi, I'm JP.
  paragraphs:
    - I spent 8 years in agency and in-house marketing and analytics, measuring what campaigns actually did.
    - I started 21 Jewel because owner-run shops get sold marketing they can't see. I do the work myself, I use the tools you already pay for, and I show you the numbers.
  link: { label: More about me, href: "/about" }

final_cta:
  heading: Find out what's costing you calls.
  body: The Website Review is free, takes about 3 minutes to request, and you keep the checklist either way.
  button: { label: Get my free Website Review, href: "/review" }
