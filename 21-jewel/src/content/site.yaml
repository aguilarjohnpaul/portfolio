# Brand, contact, nav, footer, feature flags and founding spot counts.
# Edit values here. Components read everything from this file.

brand:
  name: 21 Jewel                      # wordmark
  legal_name: 21 Jewel Advisory       # schema, titles, footer; matches the Google Business Profile
  url: https://21jeweladvisory.com
  email: johnpaul@21jeweladvisory.com
  phone: (737) 391-3041
  phone_href: "+17373913041"
  location: San Antonio, TX
  founder: JP
  tagline: Get found. Get chosen. Get the call.
  # One-liner used in structured data (Change 02 §1).
  one_liner: "Local search for San Antonio service businesses. I set your business up to show up on Google, Bing and Maps and to get the call: profiles, listings, reviews and website pages, done by one person, month-to-month, with the numbers before and after."
  values:
    - Honest over impressive
    - Serve the person, not the project
    - Build things that outlast me

links:
  # Cal.com "20-minute fit call" link.
  cal: "https://cal.com/21jewel/20min"
  # Tally founding application form.
  tally: "https://tally.so/r/7XRqva"
  # Public profiles for schema sameAs. Leave "" until live.
  google_profile: ""
  linkedin: ""

# Feature flags. Flip to true to show a section or page. Nothing else needs to change.
flags:
  showFounding: false      # founding band, nav link, /founding-clients, /thanks/founding
  showResults: false       # /results and the homepage proof slot
  showFaq: true            # FAQ blocks and their FAQPage schema
  showTerms: false         # /terms and its footer link (needs a lawyer review first)
  showAreas: false         # /areas/* (Change 03 §3.1). Needs entries with proof first.
  showSpanish: false       # /es/* (Change 03 §3). Nothing built yet.
  showClarity: false       # Microsoft Clarity (Change 03 §10). Needs a project id and a privacy line.
  showScorecardLink: true  # scorecard link in the footer
  realExamples: false      # industry worked examples labeled as real instead of "Example"

founding:
  total: 5
  filled: 0

heroTest:
  enabled: true
  # Set to "a" or "b" to end the test and show only that hero.
  winner: ""

router:
  # Phase 2 hook: two-path router. Leave false.
  enabled: false

nav:
  skip: Skip to content
  home_label: 21 Jewel home
  menu_open: Menu
  menu_close: Close
  # Dropdown groups (desktop) and flat group labels (mobile menu).
  groups:
    - label: Services
      links:
        - { label: Get Found Setup, href: "/services/get-found" }
        - { label: Get Chosen Setup, href: "/services/get-chosen" }
        - { label: Keep Ranking, href: "/services/keep-ranking" }
    - label: Industries
      links:
        - { label: Sign and print shops, href: "/industries/sign-print" }
        - { label: Roofing, href: "/industries/roofing" }
        - { label: Plumbing, href: "/industries/plumbing" }
        - { label: Electrical, href: "/industries/electrical" }
        - { label: Remodeling, href: "/industries/remodeling" }
        - { label: Landscaping and tree service, href: "/industries/landscaping-tree" }
  links:
    - { label: Pricing, href: "/pricing" }
    - { label: Learn, href: "/learn" }
    - { label: About, href: "/about" }
  # Added before About when flags.showFounding is true.
  founding_link: { label: Founding clients, href: "/founding-clients" }
  cta: { label: Free Local Search Audit, href: "/audit" }
  # Header button text on phones.
  cta_short: Free audit
  # Phone icon button in the header on phones.
  phone_label: Call JP

# Mobile sticky bar (Change 03 §3). Hidden on /audit and while a form is on screen.
sticky:
  call: (737) 391-3041
  cta: { label: Free audit, href: "/audit" }

# Trust strip under every primary call to action (Change 03 §2.3).
trust:
  label: What working with me looks like
  items:
    - I do the work myself.
    - Month-to-month. No contracts.
    - You own every login.
    - No new software to pay for.
    - San Antonio. I can drive to you.

footer:
  who_heading: Who I help
  industries:
    - { label: Sign and print shops, href: "/industries/sign-print", flag: "" }
    - { label: Roofing, href: "/industries/roofing", flag: "" }
    - { label: Plumbing, href: "/industries/plumbing", flag: "" }
    - { label: Electrical, href: "/industries/electrical", flag: "" }
    - { label: Remodeling, href: "/industries/remodeling", flag: "" }
    - { label: Landscaping and tree service, href: "/industries/landscaping-tree", flag: "" }
  links_heading: More
  links:
    - { label: Pricing, href: "/pricing", flag: "" }
    - { label: Learn, href: "/learn", flag: "" }
    - { label: About, href: "/about", flag: "" }
    - { label: Scorecard, href: "/scorecard", flag: showScorecardLink }
    - { label: Privacy, href: "/privacy", flag: "" }
    - { label: Terms, href: "/terms", flag: showTerms }
  bottom: "© {year} 21 Jewel Advisory. Independent. Not affiliated with Google."

spots:
  open_label: "{n} of {total} spots open"
  full_label: All founding spots are taken. Join the waitlist.
  apply: See if you're a fit
  waitlist: Join the waitlist

seo:
  og_image: /og.png
  # Describes the share image (it shows hero variant A's headline).
  og_image_alt: "21 Jewel Advisory: When someone nearby searches for what you do, show up. Then get the call. (737) 391-3041"
  pages:
    home:
      title: "Local search for San Antonio service businesses · 21 Jewel Advisory"
      description: "Show up when San Antonio searches for what you do, on Google, Bing and Maps, and get the call. One person, month-to-month, you own every login. Free audit."
    audit:
      title: "Free Local Search Audit · San Antonio · 21 Jewel Advisory"
      description: "A 10-minute video and a one-page scorecard: the top 3 things costing your business calls on Google, Bing and Maps, ranked. Free, in 5 business days."
    scorecard:
      title: "Is Your Website Losing You Work? · 21 Jewel Advisory"
      description: "12 quick questions about your Google profile, website and follow-up. Get your score and biggest leaks in 3 minutes."
    pricing:
      title: "Pricing · San Antonio local search · 21 Jewel Advisory"
      description: "Free Local Search Audit, Get Found Setup from $650, Get Chosen Setup from $1,450, Keep Ranking $450/month. Month-to-month, you own every login."
    service-get-found:
      title: "Get Found Setup · Google, Bing and Apple profiles · 21 Jewel Advisory"
      description: "Your Google Business Profile rebuilt, Bing and Apple claimed, 10 listings fixed and a review system set up in 10 business days. From $650, San Antonio."
    service-get-chosen:
      title: "Get Chosen Setup · website pages that get the call · 21 Jewel Advisory"
      description: "Homepage and up to 3 service pages rewritten on your current platform, one-tap calling, a 5-field quote form and tracking. From $1,450 in about 3 weeks."
    service-keep-ranking:
      title: "Keep Ranking · month-to-month local search · 21 Jewel Advisory"
      description: "4 profile posts, review asks and replies, listings checked, one page a quarter and a one-page report each month. $450/month, cancel any month."
    founding:
      title: "Founding clients: Get Found Setup, free · 21 Jewel Advisory"
      description: "5 spots for San Antonio service businesses. Free Get Found Setup in exchange for sharing the before-and-after numbers."
    learn:
      title: "Learn · local search guides for San Antonio owners · 21 Jewel Advisory"
      description: "Plain guides on showing up on Google Maps, getting reviews, the 10 listings that matter, what leads really cost and what local SEO should cost. Written for owners."
    about:
      title: "About JP · 21 Jewel Advisory"
      description: "Agency and analytics background. I do the work myself, use your existing tools and show you the numbers."
    sign-print:
      title: "Local search for San Antonio sign and print shops · 21 Jewel Advisory"
      description: "Show up for banners, yard signs and vehicle wraps, get reviews after every order, and take quotes in 5 fields. Free audit, setups from $650."
    plumbing:
      title: "Local search for San Antonio plumbers · 21 Jewel Advisory"
      description: "Right hours, one phone number everywhere, a profile that ranks for water heaters and emergencies. Cut paid leads. Free audit, setups from $650."
    electrical:
      title: "Local search for San Antonio electricians · 21 Jewel Advisory"
      description: "Show up for panel upgrades, EV chargers and generators, not just emergencies. Pages with price ranges. Free audit, setups from $650."
    remodeling:
      title: "Local search for San Antonio remodelers · 21 Jewel Advisory"
      description: "Fewer out-of-budget inquiries, more of the right ones. Before-and-after photos, budget ranges, a 5-field inquiry form. Free audit, setups from $650."
    landscaping-tree:
      title: "Tree and landscape local search, San Antonio · 21 Jewel Advisory"
      description: "Show up for tree removal, trimming and oak wilt across your real service area, with reviews from every invoice. Free audit, setups from $650."
    roofing:
      title: "Local search for San Antonio roofers · 21 Jewel Advisory"
      description: "The right category, steady reviews, real roof photos and a one-tap inspection request. Map pack in your service area within 90 days. Free audit."
    results:
