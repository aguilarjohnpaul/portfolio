# Brand, contact, nav, footer, feature flags and founding spot counts.
# Edit values here. Components read everything from this file.

brand:
  name: 21 Jewel
  url: https://21jeweladvisory.com
  email: johnpaul@21jeweladvisory.com
  location: San Antonio, TX
  founder: JP
  tagline: Precise work. More calls.
  # One-liner used in structured data (Change 02 §1).
  one_liner: "I help local service businesses get more calls from Google: a cleaner Google profile, steady reviews, and a website that turns visits into quote requests."
  values:
    - Honest over impressive
    - Serve the person, not the project
    - Build things that outlast me

links:
  # Cal.com "20-minute fit call" link.
  cal: "https://cal.com/21jewel/20min"
  # Tally founding application form.
  tally: "https://tally.so/r/7XRqva"

# Feature flags. Flip to true to show a section or page. Nothing else needs to change.
flags:
  showFounding: false   # founding band, nav link, /founding-clients, /thanks/founding
  showResults: false    # /results and the homepage proof slot
  showHvac: false       # /industries/hvac and its footer link
  showRoofing: false    # /industries/roofing and its footer link
  showFaq: false        # FAQ on the homepage and /offers
  showTerms: false      # /terms and its footer link (needs a lawyer review first)

founding:
  total: 5
  filled: 0

heroTest:
  enabled: true
  # Set to "a" or "b" to end the test and show only that hero.
  winner: ""

router:
  # Phase 2 hook: two-path router. Leave false.
  enabled: false

nav:
  skip: Skip to content
  home_label: 21 Jewel home
  menu_open: Menu
  menu_close: Close
  links:
    - { label: How it works, href: "/#how" }
    - { label: Offers, href: "/offers" }
    - { label: About, href: "/about" }
  # Added between Offers and About when flags.showFounding is true.
  founding_link: { label: Founding clients, href: "/founding-clients" }
  cta: { label: Free Website Review, href: "/review" }
  # Shown in the header on phones narrower than 460px.
  cta_short: Free review

footer:
  who_heading: Who I help
  industries:
    - { label: Sign and print shops, href: "/industries/sign-print", flag: "" }
    - { label: HVAC, href: "/industries/hvac", flag: showHvac }
    - { label: Roofing, href: "/industries/roofing", flag: showRoofing }
  links_heading: More
  links:
    - { label: Scorecard, href: "/scorecard", flag: "" }
    - { label: Offers, href: "/offers", flag: "" }
    - { label: For studios, href: "/studios", flag: "" }
    - { label: Privacy, href: "/privacy", flag: "" }
    - { label: Terms, href: "/terms", flag: showTerms }
  bottom: "© {year} 21 Jewel. Independent. Not affiliated with Google."
  theme_label: Theme
  theme_options:
    - { value: light, label: Light }
    - { value: dark, label: Dark }
    - { value: system, label: System }

spots:
  open_label: "{n} of {total} spots open"
  full_label: All founding spots are taken. Join the waitlist.
  apply: See if you're a fit
  waitlist: Join the waitlist

seo:
  og_image: /og.png
  # Describes the share image (it shows hero variant A's headline).
  og_image_alt: "21 Jewel: More calls from Google. No new software."
  pages:
    home:
      title: "21 Jewel · More calls from Google for local service businesses"
      description: "I fix your Google profile, reviews and website so more searches turn into calls. San Antonio-based. Free Website Review."
    review:
      title: "Free Website Review · 21 Jewel"
      description: "Get the top 3 things costing you calls, ranked, plus a checklist you keep. Free for local service businesses."
    scorecard:
      title: "Is Your Website Losing You Work? · 21 Jewel"
      description: "12 quick questions about your Google profile, website and follow-up. Get your score and biggest leaks in 3 minutes."
    offers:
      title: "Offers and prices · 21 Jewel"
      description: "Free Website Review, Google Profile Tune-Up from $450, The 30-Day Fix from $1,250, Growth Advisor from $500/month."
    founding:
      title: "Founding clients: The 30-Day Fix, free · 21 Jewel"
      description: "5 spots for local service businesses. Free 30-Day Fix in exchange for sharing the results."
    about:
      title: "About JP · 21 Jewel"
      description: "Agency and analytics background. I do the work myself, use your existing tools and show you the numbers."
    sign-print:
      title: "More quote requests for sign and print shops · 21 Jewel"
      description: "Google profile, reviews and a quote-ready page for sign and print shops."
    hvac:
      title: "More calls from Google for HVAC companies · 21 Jewel"
      description: "Google profile, reviews and one-tap calling for HVAC companies."
    roofing:
      title: "More inspection requests for roofing companies · 21 Jewel"
      description: "Photos, reviews and an easy inspection request for roofing companies."
    results:
      title: "Results · 21 Jewel"
      description: "Before-and-after numbers from local service businesses."
    studios:
      title: "White-label Strategy Sprint · 21 Jewel"
      description: "For design studios of 2 to 10 people. Strategy delivered under your studio's name."
    privacy:
      title: "Privacy · 21 Jewel"
