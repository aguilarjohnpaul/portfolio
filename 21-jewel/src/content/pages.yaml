audit:
  heading: Your free Local Search Audit
  intro: Tell me about your business. Within 5 business days you get a 10-minute screen recording and a one-page scorecard with the top 3 things costing you calls, ranked, and how to fix each one.
  get_heading: What you get
  get:
    - How you show up right now on Google, Bing and Apple Maps for the three searches your customers actually make.
    - What your reviews say to someone choosing between you and the shop down the street.
    - Whether your website gets the call on a phone, measured in taps.
    - The top 3 fixes, ranked by the calls they're likely costing you. Yours to keep, no strings.
  how_heading: How it works
  steps:
    - Fill out the form. About 3 minutes.
    - I look at your profiles, listings, reviews and website from the outside, the way a customer does.
    - You get the video and the scorecard by email within 5 business days. If you want, we talk it through on a 20-minute call.
  need_heading: What I'll need from you
  need: Nothing. Everything I look at is public. No logins, no passwords, no access.
  capacity: I take 5 audits a week so each one gets real attention.
  phone_heading: Rather talk?
  phone_label: Call or text
  form:
    heading: Tell me about your business
    business: Business name
    trade: What you do
    trade_hint: For example, roofing, plumbing, sign shop, landscaping.
    city: City or ZIP you work from
    website: Website (optional)
    website_placeholder: yourbusiness.com
    no_website: No website yet
    email: Best email
    phone: Phone (optional, if you'd rather I text you)
    situation: What's going on?
    situations:
      - { value: quiet, label: My phone's too quiet }
      - { value: paying, label: I'm paying for leads and want my own }
      - { value: maps, label: Not showing up on Maps }
      - { value: reviews, label: Reviews are stale or bad }
      - { value: check, label: Not sure, just check }
    source: How did you hear about me? (optional)
    honeypot: Leave this field empty
    submit: Send my audit request
    sending: Sending…
    privacy_note: "I'll email you the audit and nothing else unless you ask. Reply \"stop\" any time and I'll remove you."
    privacy_link: Privacy
  errors:
    required: This one's needed.
    invalid_email: That email doesn't look right. Check it and try again.
    verification_failed: "We couldn't confirm you're not a bot. Refresh the check below and try again."
    list_unavailable: "I couldn't save your request just now. Try again in a minute, or email me at johnpaul@21jeweladvisory.com."
    network: "Something went wrong sending your request. Try again in a minute, or email me at johnpaul@21jeweladvisory.com."

about:
  heading: "Hi, I'm JP. Texas born and raised."
  intro: "I've spent 8 years running marketing for national names like Mailchimp and Saatva, and Texas brands like Howler Brothers and Sendero Provisions. Now I use what I learned to help local shops get more calls from Google."
  paragraphs:
    - "My job was always measuring what campaigns actually did, not what they claimed."
    - "I started 21 Jewel because owner-run shops get sold marketing they can't see. Monthly fees, vague reports, no idea what changed."
  differently_heading: I work differently
  differently:
    - I do the work myself.
    - I use the tools you already pay for.
    - I save your numbers before I start, so we both know what changed.
    - I'm based in San Antonio and work with a small number of businesses at a time.
  values_heading: What I believe
  values:
    - { title: Honest over impressive., body: "I'll tell you what will and won't help, even if it means a smaller project." }
    - { title: "Serve the person, not the project.", body: "Your time matters, so I keep your part to minutes." }
    - { title: Build things that outlast me., body: "You own everything, and it keeps working after we're done." }
  photo: ""
  photo_alt: JP, founder of 21 Jewel Advisory
  button: { label: Get my free Local Search Audit, href: "/audit" }
  book_label: Book a 20-minute call

results:
  heading: Results
  intro: Before-and-after numbers from local service businesses. Only real results, never estimates.
  empty: The first case studies are in progress.
  columns: [Day 0, Day 30, Day 60, Day 90]

privacy:
  heading: Privacy
  updated_label: Last updated
  intro: This site collects as little as it needs. Here's what each service stores and why.
  services:
    - name: The Local Search Audit form
      body: "If you request a free Local Search Audit, your business name, what you do, your city, website, email, phone (if given), what's going on and how you heard about me are saved in a private Google Sheet, along with which homepage headline you saw and the link you arrived from. I use them to do your audit and to follow up about it two or three times from my own email. You get a confirmation from my Gmail."
    - name: Google Sheets and Gmail (scorecard email)
      body: "If you ask for your scorecard results, your email, optional first name, business type and score are saved in a private Google Sheet. I use them to send your results from Gmail and the occasional note. Reply \"stop\" to any email and I'll remove you."
    - name: Cal.com (bookings)
      body: If you book a call, Cal.com stores your name, email and the time you chose, and sends us both a calendar invite.
    - name: Tally (applications)
      body: If you apply for a founding client spot, Tally stores your answers and emails them to me.
    - name: Google Analytics (analytics)
      body: "Counts page views and button clicks, such as requesting an audit, tapping the phone number or how far down a page people read, so I can see what's working. It sets first-party cookies with a random ID and uses an approximate location (city level). It does not get your answers, your email or anything you type into a form. It isn't used for ads. It doesn't load at all if your browser sends Global Privacy Control or Do Not Track. You can also block it with Google's opt-out add-on at tools.google.com/dlpage/gaoptout."
    - name: Cloudflare Turnstile (spam protection)
      body: Checks that the audit and scorecard forms are filled in by a person. It does not use your answers.
    - name: Cloudflare (hosting)
      body: Hosts this site and keeps standard server logs, such as IP addresses, for security.
    - name: Client work access
      body: "When we work together, manager access to your Google profile and website is used only for the agreed work and removed when the work ends. The performance numbers I save are stored privately and never shared without your permission."
  storage: "Your browser also keeps your scorecard progress for this visit and which homepage headline you saw. None of that leaves your device except the headline version, which is sent with analytics events."
  deletion: "To see or delete anything I hold about you, email me at"
  deletion_suffix: and I'll take care of it within 30 days.

