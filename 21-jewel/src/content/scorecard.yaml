# The scorecard (Change 02 §4.4). 12 scored questions, 2 / 1 / 0 points each, 24 max.
# Q0 is not scored; it only tags the lead with the business type.
# Scoring rules live in src/lib/scorecard.ts.

intro:
  heading: Is your website losing you work?
  body: 12 quick questions about your Google profile, your website and how you follow up. It takes about 3 minutes. You get your score and your biggest leaks.
  start: Start
  micro: "Free · 12 questions · About 3 minutes"

question_ui:
  progress: "Question {n} of {total}"
  intro_label: First, a quick one
  back: Back
  next: Next
  keyboard_hint: "Tip: press a number to answer, Enter to continue."

industry:
  id: 0
  text: What kind of business do you run?
  options:
    - { label: Sign and print, value: sign-print }
    - { label: Roofing, value: roofing }
    - { label: Other trade, value: other-trade }
    - { label: Other service, value: other-service }

questions:
  - id: 1
    text: When someone searches your main service and your area, do you show up in the map results?
    options:
      - { label: "Yes, top 3", score: 2 }
      - { label: Somewhere further down, score: 1 }
      - { label: "Not sure, or no", score: 0 }
    fix: Tune your Google profile's categories, services and service area so you show up for the searches that matter.
  - id: 2
    text: Is your Google profile's main category the exact service that earns you the most?
    options:
      - { label: "Yes", score: 2 }
      - { label: "Close, but not exact", score: 1 }
      - { label: Not sure, score: 0 }
    fix: Set your main category to the service that earns you the most. It's the single biggest profile setting.
  - id: 3
    text: When did you get your last Google review?
    options:
      - { label: This month, score: 2 }
      - { label: 1–6 months ago, score: 1 }
      - { label: "Longer, or never", score: 0 }
    fix: Ask for a review after every job, with a link or QR code, so reviews keep coming.
  - id: 4
    text: Do you ask every customer for a review?
    options:
      - { label: "Every job, automatically", score: 2 }
      - { label: Sometimes, score: 1 }
      - { label: Rarely or never, score: 0 }
    fix: Put the review request in the tool you already use so it goes out on its own.
  - id: 5
    text: Do you reply to your Google reviews?
    options:
      - { label: All of them, score: 2 }
      - { label: Some, score: 1 }
      - { label: "No", score: 0 }
    fix: Reply to every review. Short and personal is fine, and templates make it fast.
  - id: 6
    text: Does your Google profile have recent photos of your actual work?
    options:
      - { label: Added in the last 3 months, score: 2 }
      - { label: Older photos, score: 1 }
      - { label: Few or none, score: 0 }
    fix: Add real job photos monthly. They show people what they'll get.
  - id: 7
    text: On a phone, can someone call you or request a quote from your homepage in one tap?
    options:
      - { label: "Yes", score: 2 }
      - { label: It takes a few steps, score: 1 }
      - { label: "No, or not sure", score: 0 }
    fix: Add a one-tap call button and a short quote form at the top of your homepage.
  - id: 8
    text: Does your website have its own page for each main service?
    options:
      - { label: "Yes", score: 2 }
      - { label: One page lists everything, score: 1 }
      - { label: No website, score: 0 }
    fix: Give your top service its own page. That's what shows up when people search for it.
  - id: 9
    text: Does the first line of your homepage say what you do and where?
    options:
      - { label: "Yes", score: 2 }
      - { label: Sort of, score: 1 }
      - { label: "No", score: 0 }
    fix: 'Make your first line say what you do and where, for example "Custom signs and banners in San Antonio."'
  - id: 10
    text: After a job, do past customers hear from you again?
    options:
      - { label: "Yes, on a schedule", score: 2 }
      - { label: Now and then, score: 1 }
      - { label: Not really, score: 0 }
    fix: A simple check-in after the job brings repeat work and referrals.
  - id: 11
    text: Do you know how many calls or quote requests you got last month?
    options:
      - { label: Exact number, score: 2 }
      - { label: Rough idea, score: 1 }
      - { label: No idea, score: 0 }
    fix: Check your Google profile's numbers monthly and keep them, since Google only shows about six months.
  - id: 12
    text: Do you ask new customers how they found you?
    options:
      - { label: "Every time, and I write it down", score: 2 }
      - { label: Sometimes, score: 1 }
      - { label: Never, score: 0 }
    fix: Add "How did you hear about us?" to your booking or invoice form.

bands:
  - { min: 0, max: 8, name: Losing work, slug: losing-work, headline: "You're probably losing calls to the shop down the street.", body: "The good news: the biggest fixes are usually quick. Start with the top 3 below." }
  - { min: 9, max: 16, name: Leaking calls, slug: leaking-calls, headline: "You're doing some things right, but calls are slipping through.", body: "A few fixes would close the gaps. Here are your top 3." }
  - { min: 17, max: 24, name: Built to win work, slug: built-to-win-work, headline: "You're set up to win work.", body: "Keep it up. Here's where you could still tighten up." }

result:
  eyebrow: Your result
  score_suffix: / 24
  fixes_label: Your top fixes
  perfect: No leaks found. Keep doing what you're doing.
  review_button: { label: "Want me to check this for you? Get a free Website Review", href: "/review" }
  restart: Start over

