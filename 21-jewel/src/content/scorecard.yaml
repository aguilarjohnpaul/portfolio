# The scorecard (spec §6). Questions, options, scoring bands and fixes were
# chosen deliberately. Change wording here; scoring rules live in src/lib/scorecard.ts.

intro:
  heading: Is your website losing you work?
  body: 12 quick questions about how people find you, contact you and come back. You'll see your score and your biggest leak right away.
  start: Start
  micro: "Free · 12 questions · About 3 minutes"

question_ui:
  progress: "Question {n} of {total}"
  back: Back
  next: Next
  keyboard_hint: "Tip: press 1 to 4 to answer, Enter to continue."

standard_options:
  - { label: Always, score: 3 }
  - { label: Usually, score: 2 }
  - { label: Sometimes, score: 1 }
  - { label: Rarely or never, score: 0 }

stages:
  - { id: referred, name: Get referred, slug: get-referred }
  - { id: hired, name: Get hired, slug: get-hired }
  - { id: again, name: Get hired again, slug: get-hired-again }

questions:
  - id: 1
    stage: referred
    text: When someone searches your business name, does your website come up first?
    fix: Make sure your homepage title includes your business name and what you do, and link your site from your Google Business Profile.
  - id: 2
    stage: referred
    text: Is your Google Business Profile complete and updated in the last 3 months?
    fix: Fill every field, add 10 recent photos, and post a short update each month.
  - id: 3
    stage: referred
    text: Does your website show recent reviews, work or client stories?
    fix: Add three recent reviews and one short project story to your homepage.
  - id: 4
    stage: referred
    text: When a project wraps up well, do you ask the client for a referral?
    fix: 'Ask at the moment of praise. Add one line to your wrap-up call: "Who else do you know who deals with this?"'
  - id: 5
    stage: hired
    text: Can a visitor tell what you do, who it's for and roughly what it costs within 10 seconds?
    fix: Rewrite your homepage headline to say what you do and for whom, and add "starting at" prices.
  - id: 6
    stage: hired
    text: Does every page have one clear next step that works on a phone?
    fix: Give every page one button ("Request a quote" or "Book a call") and test your form on your phone.
  - id: 7
    stage: hired
    text: How fast do you usually reply to a new inquiry?
    options:
      - { label: Within the hour, score: 3 }
      - { label: Same day, score: 2 }
      - { label: Within 1–2 days, score: 1 }
      - { label: Longer, score: 0 }
    fix: Set an auto-reply that confirms receipt and offers a call time. Aim to reply personally the same business day.
  - id: 8
    stage: hired
    text: Do you follow up on quotes or proposals that haven't been answered?
    fix: Follow up on day 2, day 7 and day 14 with a short, useful note, not a "just checking in."
  - id: 9
    stage: again
    text: Do you check in with past clients after the work ends?
    fix: Put a 30-, 90- and 180-day check-in on your calendar for every finished project.
  - id: 10
    stage: again
    text: When a project ends, do you offer a clear next step or service?
    fix: Write one natural follow-on offer for your most common project and mention it at wrap-up.
  - id: 11
    stage: again
    text: Do you ask happy clients for a Google review?
    fix: Send a review link with two prompt questions within a week of a strong finish.
  - id: 12
    stage: again
    text: Do you know where each new lead came from, including who referred them?
    fix: Add "How did you hear about us? Who referred you?" to your inquiry form and log the answer for every lead.

bands:
  - { min: 0, max: 39, name: Running on luck, slug: running-on-luck, meaning: Work comes in when it comes in. A few basics would change that fast. }
  - { min: 40, max: 69, name: "Working, but leaking", slug: working-but-leaking, meaning: "People find you, but you're losing good work at one or two stages." }
  - { min: 70, max: 100, name: Built to win work, slug: built-to-win-work, meaning: Your site and follow-up work. The gains now come from new lead sources and consistency. }

