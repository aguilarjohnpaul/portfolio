# Nightly: copy the content Sheet into 21-jewel/src/content/snapshot/ so the site can build without Google.
# Needs the repository secret SHEET_CONTENT_ID (the Sheet id from its URL). See 21-jewel/docs/google-sheet-content-setup.md.
name: Sheet snapshot

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC, 4:17am Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SHEET_SYNC_BRANCH != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.SHEET_SYNC_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the Sheet
        working-directory: 21-jewel
        env:
          SHEET_CONTENT_ID: ${{ secrets.SHEET_CONTENT_ID }}
        run: node scripts/sheet-sync.mjs
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "sheet-sync"
          git config user.email "sheet-sync@users.noreply.github.com"
          git add 21-jewel/src/content/snapshot
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Snapshot the content Sheet"
          git push
